<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<meta
			name="description"
			content="Biosphere — an interactive genetics workspace for pedigrees, inheritance analysis, Punnett squares, and sequence translation."
		/>
		%sveltekit.head%
		<script>
			// Apply the saved theme before first paint to avoid a flash.
			try {
				var stored = JSON.parse(localStorage.getItem('biosphere.settings.v1') || 'null');
				var mode = (stored && stored.theme) || 'system';
				var dark =
					mode === 'dark' ||
					(mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.dataset.theme = dark ? 'dark' : 'light';
			} catch (error) {
				/* keep the default light theme */
			}
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
